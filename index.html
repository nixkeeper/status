<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nixkeeper status</title>
<meta name="description" content="Whether each of nixkeeper's workflows, digests and tokens is on time.">
<style>
  :root {
    --bg: #f6f7f8;
    --surface: #ffffff;
    --line: #e1e4e8;
    --ink: #14171a;
    --ink-soft: #565c63;
    --ink-faint: #6b7177;
    --link: #2f5fb3;
    --green: #2e9e5b;
    --yellow: #c99a06;
    --red: #d1453b;
    --grey: #9aa0a6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --surface: #1e2126;
      --line: #2e3238;
      --ink: #edeff2;
      --ink-soft: #a3a8b0;
      --ink-faint: #848990;
      --link: #8ab4f8;
      --green: #3fb96f;
      --yellow: #e0b42a;
      --red: #f0645a;
      --grey: #6e747b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 22px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .sub { color: var(--ink-soft); margin: 0 0 24px; }
  .stale {
    border: 1px solid var(--line);
    border-left: 4px solid var(--yellow);
    background: var(--surface);
    padding: 10px 14px;
    border-radius: 6px;
    margin: 0 0 20px;
  }
  .stale.red { border-left-color: var(--red); }
  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--ink-faint);
    margin: 28px 0 8px;
  }
  ul.rows {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  ul.rows > li {
    display: grid;
    grid-template-columns: 14px minmax(0, 1fr);
    gap: 4px 12px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
  }
  ul.rows > li:first-child { border-top: 0; }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-top: 6px;
    background: var(--grey);
  }
  h1 .dot { margin-top: 0; width: 12px; height: 12px; }
  .dot.green { background: var(--green); }
  .dot.yellow { background: var(--yellow); }
  .dot.red { background: var(--red); }
  .name { font-weight: 600; }
  .every { color: var(--ink-faint); font-size: 13px; margin-left: 6px; }
  ul.parts { list-style: none; margin: 2px 0 0; padding: 0; color: var(--ink-soft); font-size: 14px; }
  ul.parts li { overflow-wrap: anywhere; }
  ul.parts li.yellow { color: var(--yellow); }
  ul.parts li.red { color: var(--red); }
  ul.parts li.note { color: var(--ink-faint); }
  footer { margin-top: 32px; color: var(--ink-faint); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1><span class="dot" id="overall"></span>nixkeeper status</h1>
  <p class="sub" id="checked">Reading…</p>
  <div id="content"></div>
  <footer>
    Green: on time. Yellow: late. Red: needs attention, with an
    <a href="https://github.com/nixkeeper/status/issues?q=label%3Astatus">issue</a>
    opened until it's on time again. Grey: couldn't be read. Checked every
    hour by <a href="https://github.com/nixkeeper/status">nixkeeper/status</a>;
    <a href="https://nixkeeper.com/">nixkeeper.com</a>.
  </footer>
</main>
<script>
  // status.json from the data branch (?data=URL for another).
  const DATA =
    new URLSearchParams(location.search).get('data') ||
    'https://raw.githubusercontent.com/nixkeeper/status/data/data/status.json';
  // The check runs hourly: older than this, its results are old news.
  const STALE_HOURS = 2.5;
  const DEAD_HOURS = 5;

  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  function ago(iso) {
    const minutes = Math.max(0, (Date.now() - new Date(iso)) / 60000);
    if (minutes < 90) return `${Math.round(minutes)} min ago`;
    if (minutes < 48 * 60) return `${(minutes / 60).toFixed(1)} h ago`;
    return `${Math.round(minutes / 1440)} days ago`;
  }

  function partHtml(p) {
    const text = esc(p.text).replace('{ago}', p.at ? ago(p.at) : '');
    const body = p.link ? `<a href="${esc(p.link)}">${text}</a>` : text;
    return `<li class="${p.state || 'note'}">${body}</li>`;
  }

  function rowHtml(r) {
    return `<li>
      <span class="dot ${esc(r.state)}" title="${esc(r.state)}"></span>
      <div>
        <a class="name" href="${esc(r.link)}">${esc(r.name)}</a><span class="every">${esc(r.every)}</span>
        <ul class="parts">${r.parts.map(partHtml).join('')}</ul>
      </div>
    </li>`;
  }

  function render(status) {
    const age = (Date.now() - new Date(status.checkedAt)) / 3600000;
    const overall = age > DEAD_HOURS ? 'red' : age > STALE_HOURS ? 'yellow' : status.state;
    document.getElementById('overall').className = `dot ${overall}`;
    const word = { red: 'Needs attention', yellow: 'Late' }[overall];
    document.title = word ? `${word} · nixkeeper status` : 'nixkeeper status';
    const run = status.run ? ` (<a href="${esc(status.run)}">the run</a>)` : '';
    document.getElementById('checked').innerHTML =
      `Checked ${ago(status.checkedAt)}${run}, ${new Date(status.checkedAt).toLocaleString()}.`;
    let html = '';
    if (age > STALE_HOURS) {
      html += `<p class="stale${age > DEAD_HOURS ? ' red' : ''}">These results are from ${ago(status.checkedAt)}: the status check itself may have stopped, so they can be out of date.</p>`;
    }
    for (const [group, title] of Object.entries(status.groups)) {
      const rows = status.rows.filter((r) => r.group === group);
      if (rows.length) html += `<h2>${esc(title)}</h2><ul class="rows">${rows.map(rowHtml).join('')}</ul>`;
    }
    document.getElementById('content').innerHTML = html;
  }

  fetch(DATA, { cache: 'no-store' })
    .then((r) => {
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return r.json();
    })
    .then(render)
    .catch((e) => {
      document.getElementById('checked').textContent = `The status couldn't be read: ${e.message}.`;
    });
</script>
</body>
</html>
