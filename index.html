<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nixkeeper status</title>
<meta name="description" content="Whether each of nixkeeper's workflows, digests and tokens is on time.">
<link rel="icon" id="favicon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* nixkeeper's colours (its page/tokens.css and style.css): green ok,
     gold late (its "warn"), pink failed, violet links. */
  :root {
    --bg: #f6f7f8;
    --surface: #ffffff;
    --line: #e3e5e8;
    --ink: #14171a;
    --ink-soft: #565c63;
    --ink-faint: #6b7177;
    --link: #534c84;
    --violet: #6156a3;
    --green: #4fa46a;
    --green-text: #28633c;
    --green-bg: #e0f5e5;
    --yellow: #ac8b26;
    --yellow-text: #695205;
    --yellow-bg: #f6eed8;
    --red: #ce6e76;
    --red-text: #803e44;
    --red-bg: #fce9ea;
    --grey: #9aa0a6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --surface: #1d2025;
      --line: #2c3036;
      --ink: #edeff2;
      --ink-soft: #a3a8b0;
      --ink-faint: #848990;
      --link: #aaa1f6;
      --violet: #8c82d4;
      --green: #6fc488;
      --green-text: #6fc488;
      --green-bg: #0c2815;
      --yellow: #cbaa4b;
      --yellow-text: #cbaa4b;
      --yellow-bg: #2b2001;
      --red: #f08d94;
      --red-text: #f08d94;
      --red-bg: #361719;
      --grey: #6e747b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 "Instrument Sans", system-ui, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 48px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 18px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  header .brand { display: flex; align-items: center; }
  header .brand img { height: 26px; width: auto; display: block; }
  header .label {
    font-size: 19px;
    font-weight: 500;
    color: var(--ink-soft);
    padding-left: 10px;
    border-left: 1px solid var(--line);
    line-height: 26px;
  }
  .summary {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    margin: 0 0 6px;
  }
  .summary.green { background: var(--green-bg); border-color: transparent; }
  .summary.yellow { background: var(--yellow-bg); border-color: transparent; }
  .summary.red { background: var(--red-bg); border-color: transparent; }
  .summary b { font-size: 17px; font-weight: 600; }
  .summary.green b { color: var(--green-text); }
  .summary.yellow b { color: var(--yellow-text); }
  .summary.red b { color: var(--red-text); }
  .summary .dot { margin-top: 0; width: 12px; height: 12px; flex: none; }
  .sub { color: var(--ink-faint); font-size: 13px; margin: 0 0 8px; }
  .stale {
    border: 1px solid var(--line);
    border-left: 4px solid var(--yellow);
    background: var(--surface);
    padding: 10px 14px;
    border-radius: 6px;
    margin: 12px 0 0;
  }
  .stale.red { border-left-color: var(--red); }
  h2 {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-faint);
    margin: 28px 0 8px;
  }
  ul.rows {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  ul.rows > li {
    display: grid;
    grid-template-columns: 14px minmax(0, 1fr);
    gap: 4px 12px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
  }
  ul.rows > li:first-child { border-top: 0; }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-top: 6px;
    background: var(--grey);
  }
  .dot.green { background: var(--green); }
  .dot.yellow { background: var(--yellow); }
  .dot.red { background: var(--red); }
  .name { font-weight: 600; color: var(--ink); }
  .every { color: var(--ink-faint); font-size: 13px; margin-left: 6px; }
  ul.parts { list-style: none; margin: 2px 0 0; padding: 0; color: var(--ink-soft); font-size: 14px; }
  ul.parts li { overflow-wrap: anywhere; }
  ul.parts a { color: inherit; }
  ul.parts a:hover { color: var(--link); }
  ul.parts li.yellow { color: var(--yellow-text); }
  ul.parts li.red { color: var(--red-text); font-weight: 500; }
  ul.parts li.note { color: var(--ink-faint); }
  footer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--ink-faint);
    font-size: 13px;
  }
</style>
</head>
<body>
<main>
  <header>
    <a class="brand" href="https://nixkeeper.com/" title="nixkeeper.com">
      <picture>
        <source srcset="assets/nixkeeper-lockup-tight-dark.svg" media="(prefers-color-scheme: dark)">
        <img src="assets/nixkeeper-lockup-tight.svg" alt="nixkeeper" width="132" height="26">
      </picture>
    </a>
    <span class="label">status</span>
  </header>
  <p class="summary" id="summary"><span class="dot"></span><b>Reading…</b></p>
  <p class="sub" id="checked"></p>
  <div id="content"></div>
  <footer>
    Green: on time. Yellow: late. Red: needs attention, with an
    <a href="https://github.com/nixkeeper/status/issues?q=label%3Astatus">issue</a>
    opened until it's on time again. Grey: couldn't be read. Checked every
    hour by <a href="https://github.com/nixkeeper/status">nixkeeper/status</a>;
    <a href="https://nixkeeper.com/">nixkeeper.com</a>.
  </footer>
</main>
<script>
  // status.json from the data branch (?data=URL for another).
  const DATA =
    new URLSearchParams(location.search).get('data') ||
    'https://raw.githubusercontent.com/nixkeeper/status/data/data/status.json';
  // The check runs hourly: older than this, its results are old news.
  const STALE_HOURS = 2.5;
  const DEAD_HOURS = 5;

  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  function ago(iso) {
    const minutes = Math.max(0, (Date.now() - new Date(iso)) / 60000);
    if (minutes < 90) return `${Math.round(minutes)} min ago`;
    if (minutes < 48 * 60) return `${(minutes / 60).toFixed(1)} h ago`;
    return `${Math.round(minutes / 1440)} days ago`;
  }

  function partHtml(p) {
    const text = esc(p.text).replace('{ago}', p.at ? ago(p.at) : '');
    const body = p.link ? `<a href="${esc(p.link)}">${text}</a>` : text;
    return `<li class="${p.state || 'note'}">${body}</li>`;
  }

  function rowHtml(r) {
    return `<li>
      <span class="dot ${esc(r.state)}" title="${esc(r.state)}"></span>
      <div>
        <a class="name" href="${esc(r.link)}">${esc(r.name)}</a><span class="every">${esc(r.every)}</span>
        <ul class="parts">${r.parts.map(partHtml).join('')}</ul>
      </div>
    </li>`;
  }

  function render(status) {
    const age = (Date.now() - new Date(status.checkedAt)) / 3600000;
    const overall = age > DEAD_HOURS ? 'red' : age > STALE_HOURS ? 'yellow' : status.state;
    const count = (state) => status.rows.filter((r) => r.state === state).length;
    const [red, yellow, unknown] = [count('red'), count('yellow'), count('unknown')];
    const said = [
      red && `${red} need${red === 1 ? 's' : ''} attention`,
      yellow && `${yellow} late`,
      unknown && `${unknown} couldn't be read`,
    ].filter(Boolean);
    const headline =
      age > STALE_HOURS ? 'The status check is late' : said.length ? said.join(', ') : 'Everything is on time';
    document.getElementById('summary').className = `summary ${overall}`;
    document.getElementById('summary').innerHTML = `<span class="dot ${esc(overall)}"></span><b>${esc(headline)}</b>`;
    const word = { red: 'Needs attention', yellow: 'Late' }[overall];
    document.title = word ? `${word} · nixkeeper status` : 'nixkeeper status';
    // The tab's icon: nixkeeper's mark, one chevron coloured as on its
    // page (green ok, orange late, pink failing).
    const icon = { green: 'ok', yellow: 'r', red: 'f' }[overall];
    document.getElementById('favicon').href = `assets/favicon${icon ? `-${icon}` : ''}.svg`;
    const run = status.run ? ` (<a href="${esc(status.run)}">the run</a>)` : '';
    document.getElementById('checked').innerHTML =
      `Checked ${ago(status.checkedAt)}${run}, ${new Date(status.checkedAt).toLocaleString()}.`;
    let html = '';
    if (age > STALE_HOURS) {
      html += `<p class="stale${age > DEAD_HOURS ? ' red' : ''}">These results are from ${ago(status.checkedAt)}: the status check itself may have stopped, so they can be out of date.</p>`;
    }
    for (const [group, title] of Object.entries(status.groups)) {
      const rows = status.rows.filter((r) => r.group === group);
      if (rows.length) html += `<h2>${esc(title)}</h2><ul class="rows">${rows.map(rowHtml).join('')}</ul>`;
    }
    document.getElementById('content').innerHTML = html;
  }

  fetch(DATA, { cache: 'no-store' })
    .then((r) => {
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return r.json();
    })
    .then(render)
    .catch((e) => {
      document.getElementById('summary').innerHTML = `<span class="dot"></span><b>The status couldn't be read</b>`;
      document.getElementById('checked').textContent = e.message;
    });
</script>
</body>
</html>
